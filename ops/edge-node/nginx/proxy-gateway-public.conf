log_format proxy_gateway '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

log_format proxy_gateway_artifact '$remote_addr - $remote_user [$time_local] "$request_method /sub/a/[redacted] $server_protocol" '
                                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80 default_server;
    server_name sub.globalcirclecat.com _;

    access_log /var/log/nginx/proxy-gateway-access.log proxy_gateway;
    error_log /var/log/nginx/proxy-gateway-error.log warn;

    location = /api/health {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3456;
    }

    location = /sub/clash.yaml {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3456;
    }

    location ^~ /sub/a/ {
        access_log /var/log/nginx/proxy-gateway-access.log proxy_gateway_artifact;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3456;
    }

    location ^~ /api/admin/ {
        return 404;
    }

    location / {
        return 404;
    }
}
