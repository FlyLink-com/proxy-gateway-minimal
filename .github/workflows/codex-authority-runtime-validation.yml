name: Codex Authority Runtime Validation

on:
  push:
    branches:
      - codex/commerce-authority-runtime

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check final diff
        run: git diff --check 0ac923f5559de0bbf84f9b469b77bf800d470265...HEAD

      - name: Run server tests
        run: npm test

      - name: Publish validation result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$JOB_RESULT" == "success" ]]; then
            state=success
            description="npm test and git diff --check passed"
          else
            state=failure
            description="Authority runtime validation failed"
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$state\",\"context\":\"codex/authority-runtime-validation\",\"description\":\"$description\"}"
