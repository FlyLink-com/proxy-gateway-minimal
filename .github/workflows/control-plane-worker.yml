name: Control Plane Worker

# Local-only validation for the G3 control-plane Worker slice.
# Runs the Miniflare test suites; uses no Cloudflare credentials,
# creates no remote resources, and never deploys.
on:
  pull_request:
    paths:
      - "workers/control-plane/**"
      - "agent/g4/**"
      - "scripts/d1-uf16-reconcile-local.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/control-plane-worker.yml"
      - "tools/c2-worker-config-policy/**"
      # G-3 (S4A precheck): the Worker slice tests import these server
      # modules directly, so a server-only change to any of them must
      # trigger this workflow. #940 changed seven server files and
      # never triggered it, because no server/** path was listed.
      # Only the actually-imported dependencies are listed here, not
      # the whole server/ tree. The Worker-side handoff fixture is
      # already covered by workers/control-plane/** above.
      - "server/services/platform/single-writer-authority.mjs"
      - "server/services/platform/d1-stage2-freeze-drain.mjs"
      - "server/services/platform/d1-card9-freeze-drain-coordinator.mjs"
      - "server/services/platform/d1-freeze-executor.mjs"
      - "server/services/platform/d1-stage2-credential-reconciliation.mjs"
      - "server/services/platform/d1-stage2-source-manifest.mjs"
      - "server/services/platform/writer-freeze-receipt.mjs"
      - "server/tests/agent-g4-contract.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a new push to the same PR branch cancels the stale
# in-progress run instead of piling up parallel runs on superseded heads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Worker slice tests (local Miniflare D1)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workers/control-plane
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/control-plane/package-lock.json
      # The synthetic Coordinator → Worker → Agent fixture imports the
      # repository's SQLite implementation. Use its existing locked dependency;
      # do not add a native Node module to the deployable Worker package.
      - name: Install repository test prerequisites
        working-directory: .
        run: npm ci --omit=dev
      - name: Install Worker test dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Run C2 Worker configuration policy tests
        working-directory: .
        run: |
          node --test tools/c2-worker-config-policy/check.test.mjs
          node tools/c2-worker-config-policy/check.mjs
