name: Control Plane Worker

# Local-only validation for the G3 control-plane Worker slice.
# Runs the Miniflare test suites; uses no Cloudflare credentials,
# creates no remote resources, and never deploys.
on:
  pull_request:
    paths:
      - "workers/control-plane/**"
      - ".github/workflows/control-plane-worker.yml"
      - "tools/c2-worker-config-policy/**"
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a new push to the same PR branch cancels the stale
# in-progress run instead of piling up parallel runs on superseded heads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Worker slice tests (local Miniflare D1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workers/control-plane
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/control-plane/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Run C2 Worker configuration policy tests
        working-directory: .
        run: |
          node --test tools/c2-worker-config-policy/check.test.mjs
          node tools/c2-worker-config-policy/check.mjs
