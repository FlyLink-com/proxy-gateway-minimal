name: S4B Staging verification (GitHub Secrets)

# Manual-only verification of the S4B Agent loop against the existing
# Staging Worker + D1, using credentials held in GitHub Secrets.
# - No deployment, no D1 creation, no config change, no Token creation.
# - Writes ONLY synthetic rows to the existing Staging D1 (one node, two
#   channels, one credential, one desired state, two materials), all with
#   distinct synthetic PKs. Never touches the 20-row baseline.
# - The epoch fence is expected to reject the fetch (authority is still
#   BWH/BWH_ACTIVE): formal entry -> 400 writer_epoch_required, direct
#   probe with epoch 1 -> 503 writer_authority_not_d1. That is the fence
#   working as designed, not a failure. The full claim-apply-receipt
#   loop needs D1_ACTIVE, which is a separate approval and is NOT done
#   here. A green run means "evidence collected, fence confirmed";
#   it does NOT mean S4B passes.
# - Secrets are read ONLY from env vars. No secret value is ever printed,
#   written to disk (except the 0600 token file run-once.mjs requires,
#   deleted in a finally block), or included in the results artifact.
# - Required secrets (in the GitHub Environment "s4b-staging", NOT at
#   repo level): S4B_TEST_AGENT_TOKEN (48-char bearer token),
#   CLOUDFLARE_API_TOKEN (must have D1 Edit on the Staging D1; the
#   repo's existing secret is only proven for wrangler deploy, so
#   replace it with a D1-Edit token, e.g. the FlyLink DevOps-Connector
#   Token, if the D1 writes return 403). The job declares
#   `environment: s4b-staging`; the environment is protected (deployment
#   branches limited to master). Migration checklist (create the
#   environment, set protection rules, move the two secrets there, then
#   remove the repo-level copies) is in the PR description — do NOT run
#   this workflow before that migration is done.
# - Trigger: workflow_dispatch only, with a typed confirmation.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "run s4b staging verify" to confirm this run writes synthetic rows to the Staging D1.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: s4b-staging-verify
  cancel-in-progress: false

jobs:
  verify:
    name: S4B Staging verification
    environment: s4b-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      S4B_ACCOUNT_ID: 17d66c001f9d851fa0d5a88cd311c2c0
      S4B_DATABASE_ID: 1ec6458a-0ac0-4ab0-92f3-5ba58b775acc
      S4B_WORKER_URL: https://flylink-control-plane-staging.gccltd-co2026.workers.dev
      S4B_KEY_ID: key-synth-s4bv2-cred-01
      S4B_NODE_REF: node-synth-s4bv2-cred-01
      S4B_CHANNEL_REFS: chan-synth-s4bv2-cred-hy2,chan-synth-s4bv2-cred-vless
      S4B_DESIRED_STATE_REF: desired-synth-s4bv2-cred-001
      S4B_GENERATION: gen-synth-s4bv2-cred-001
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Require confirmation
        # The input is passed via env, never interpolated into the shell
        # command: a crafted confirmation value is compared as a plain
        # string and can never be executed.
        shell: bash
        env:
          S4B_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$S4B_CONFIRMATION" = "run s4b staging verify"

      - name: Write verification script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s4b-results"
          cat > "$RUNNER_TEMP/s4b-verify.mjs" <<'S4B_EOF'
          // S4B Staging verification — GitHub Actions runner script.
          //
          // Secrets arrive ONLY via environment variables (CLOUDFLARE_API_TOKEN,
          // S4B_TEST_AGENT_TOKEN). This script never prints a secret value, never
          // writes one to disk (except the 0600 token file run-once.mjs requires,
          // deleted in a finally block), and never includes one in results.json.
          // The bearer token's SHA-256 digest is written to D1 (that is the
          // Worker's storage format); only the digest LENGTH and a match/mismatch
          // flag are recorded here, never the digest value itself.
          import { createHash, generateKeyPairSync, randomUUID } from "node:crypto";
          import { chmod, mkdir, rm, writeFile } from "node:fs/promises";
          import { spawn } from "node:child_process";
          import { join } from "node:path";

          const ACCOUNT_ID = process.env.S4B_ACCOUNT_ID;
          const DATABASE_ID = process.env.S4B_DATABASE_ID;
          const WORKER_URL = process.env.S4B_WORKER_URL;
          const KEY_ID = process.env.S4B_KEY_ID;
          const NODE_REF = process.env.S4B_NODE_REF;
          const CHANNELS = (process.env.S4B_CHANNEL_REFS || "").split(",").filter(Boolean);
          const DESIRED_REF = process.env.S4B_DESIRED_STATE_REF;
          const GENERATION = process.env.S4B_GENERATION;
          const CF_TOKEN = process.env.CLOUDFLARE_API_TOKEN;
          const AGENT_TOKEN = process.env.S4B_TEST_AGENT_TOKEN;
          const RUNNER_TEMP = process.env.RUNNER_TEMP;
          const WORKSPACE = process.env.GITHUB_WORKSPACE;

          const D1_URL = `https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/d1/database/${DATABASE_ID}/query`;
          const TABLES = [
            "agent_nodes", "agent_node_channels", "agent_desired_states",
            "agent_desired_state_materials", "agent_api_credentials",
            "agent_request_nonces", "agent_manifest_claims", "agent_apply_receipts",
            "agent_credential_events", "platform_accounts",
            "platform_portal_second_factor_challenges",
            "platform_write_idempotency_keys", "d1_migrations",
            "platform_writer_authority", "platform_writer_gate",
          ];

          // Row-by-row reconciliation: each table's primary-key columns,
          // from workers/control-plane/migrations/0001-0006 (d1_migrations
          // is a Cloudflare system table: its `name` column is UNIQUE).
          const ROW_KEYS = {
            agent_nodes: ["node_ref"],
            agent_node_channels: ["node_ref", "channel_ref"],
            agent_desired_states: ["desired_state_ref"],
            agent_desired_state_materials: ["desired_state_ref", "edge_credential_ref"],
            agent_api_credentials: ["key_id"],
            agent_request_nonces: ["key_id", "nonce"],
            agent_manifest_claims: ["idempotency_key"],
            agent_apply_receipts: ["idempotency_key"],
            agent_credential_events: ["event_id"],
            platform_accounts: ["id"],
            platform_portal_second_factor_challenges: ["id"],
            platform_write_idempotency_keys: ["scope", "idempotency_key"],
            d1_migrations: ["name"],
            platform_writer_authority: ["singleton"],
            platform_writer_gate: ["singleton"],
          };

          // Deterministic JSON: object keys sorted recursively, so the same
          // row always hashes the same way regardless of column order.
          function canonicalJson(value) {
            if (value === null || typeof value !== "object") return JSON.stringify(value);
            if (Array.isArray(value)) return `[${value.map(canonicalJson).join(",")}]`;
            const keys = Object.keys(value).sort();
            return `{${keys.map((k) => `${JSON.stringify(k)}:${canonicalJson(value[k])}`).join(",")}}`;
          }
          function rowKey(table, row) {
            const cols = ROW_KEYS[table] || [];
            const parts = cols.map((c) => row[c]);
            if (parts.some((p) => p === undefined)) return null; // fall back to hash
            return JSON.stringify(parts);
          }
          function hashRow(row) { return sha256hex(canonicalJson(row)); }
          // Full row snapshot: per table, a map from row key to content hash.
          // Only hashes and keys are kept in memory; row contents are never
          // stored in results.json (keys are synthetic identifiers).
          async function snapshotRows() {
            const snap = {};
            for (const table of TABLES) {
              const rows = await d1Rows(`SELECT * FROM ${table}`);
              const map = {};
              for (const row of rows) {
                const key = rowKey(table, row) ?? hashRow(row);
                map[key] = hashRow(row);
              }
              snap[table] = map;
            }
            return snap;
          }
          function snapshotFingerprint(snap) {
            const perTable = {};
            for (const table of TABLES) {
              const hashes = Object.values(snap[table] || {}).sort();
              perTable[table] = sha256hex(hashes.join("\n"));
            }
            return perTable;
          }
          // The rows this run may legitimately add, keyed by table. Anything
          // else that appears between baseline and readback is unexpected.
          function expectedNewKeys() {
            return {
              agent_nodes: new Set([JSON.stringify([NODE_REF])]),
              agent_node_channels: new Set(CHANNELS.map((ch) => JSON.stringify([NODE_REF, ch]))),
              agent_api_credentials: new Set([JSON.stringify([KEY_ID])]),
              agent_desired_states: new Set([JSON.stringify([DESIRED_REF])]),
              agent_desired_state_materials: new Set(CHANNELS.map((ch) =>
                JSON.stringify([DESIRED_REF, `edge-synth-s4bv2-cred-${ch.split("-").pop()}`]))),
            };
          }
          function reconcileRows(baselineSnap, afterSnap) {
            const expected = expectedNewKeys();
            const perTable = {};
            let bad = 0;
            for (const table of TABLES) {
              const before = baselineSnap[table] || {};
              const after = afterSnap[table] || {};
              const missing = Object.keys(before).filter((k) => !(k in after));
              const modified = Object.keys(before).filter((k) => k in after && before[k] !== after[k]);
              const added = Object.keys(after).filter((k) => !(k in before));
              const allowed = expected[table] || new Set();
              const unexpected = added.filter((k) => !allowed.has(k));
              if (missing.length > 0 || modified.length > 0 || unexpected.length > 0) bad += 1;
              perTable[table] = {
                baselineRows: Object.keys(before).length,
                afterRows: Object.keys(after).length,
                missing,
                modified,
                added,
                unexpectedNew: unexpected,
              };
            }
            return { perTable, bad };
          }

          const results = {
            workflow: "s4b-staging-verify",
            startedAt: new Date().toISOString(),
            workerUrl: WORKER_URL,
            keyId: KEY_ID,
            nodeRef: NODE_REF,
            channelRefs: CHANNELS,
            steps: {},
          };
          let problems = 0;
          function record(step, outcome) {
            results.steps[step] = outcome;
            if (outcome.conclusion === "FAIL" || outcome.conclusion === "BLOCKED") problems += 1;
          }
          function sha256hex(s) { return createHash("sha256").update(s).digest("hex"); }
          function nowIso() { return new Date().toISOString(); }
          function plusMs(ms) { return new Date(Date.now() + ms).toISOString(); }

          async function d1(sql, params) {
            const body = params && params.length > 0 ? { sql, params } : { sql };
            const res = await fetch(D1_URL, {
              method: "POST",
              headers: { Authorization: `Bearer ${CF_TOKEN}`, "Content-Type": "application/json" },
              body: JSON.stringify(body),
              signal: AbortSignal.timeout(60000),
            });
            const data = await res.json().catch(() => null);
            if (!res.ok || !data || data.success !== true) {
              const err = new Error(`D1 query failed http=${res.status}`);
              err.http = res.status;
              err.detail = Array.isArray(data?.errors)
                ? data.errors.map((e) => e?.message || "").filter(Boolean).join("; ").slice(0, 300)
                : "";
              throw err;
            }
            return data.result?.[0] ?? {};
          }
          async function d1Rows(sql, params) {
            const r = await d1(sql, params);
            return r.results || [];
          }
          async function d1Counts() {
            const counts = {};
            for (const table of TABLES) {
              const rows = await d1Rows(`SELECT COUNT(*) AS n FROM ${table}`);
              counts[table] = rows[0]?.n ?? null;
            }
            return counts;
          }

          function agentHeaders(epoch) {
            const headers = {
              authorization: `Bearer ${AGENT_TOKEN}`,
              "x-agent-key-id": KEY_ID,
              "x-agent-node-ref": NODE_REF,
              "x-agent-timestamp": nowIso(),
              "x-agent-nonce": randomUUID(),
              "idempotency-key": `probe:${NODE_REF}:${randomUUID()}`,
            };
            if (epoch !== undefined) headers["x-writer-epoch"] = epoch;
            return headers;
          }
          async function probe(method, path, { headers = {}, body = undefined } = {}) {
            const res = await fetch(new URL(WORKER_URL + path), {
              method,
              headers: { ...headers, ...(body !== undefined ? { "content-type": "application/json" } : {}) },
              body: body !== undefined ? JSON.stringify(body) : undefined,
              signal: AbortSignal.timeout(30000),
            });
            const data = await res.json().catch(() => null);
            return { http: res.status, code: data?.error?.code ?? null };
          }
          function runNode(args, env) {
            return new Promise((resolve) => {
              const child = spawn(process.execPath, args, {
                env: { ...process.env, ...env },
                stdio: ["ignore", "pipe", "pipe"],
              });
              let stdout = "";
              let stderr = "";
              child.stdout.on("data", (d) => { stdout += d; });
              child.stderr.on("data", (d) => { stderr += d; });
              child.on("error", (e) => resolve({ exit: 1, stdout, stderr: stderr + String(e?.message ?? e) }));
              child.on("close", (code) => resolve({ exit: code ?? 1, stdout, stderr }));
            });
          }

          async function main() {
            // 0. Env validation (never print secret values).
            if (!CF_TOKEN || !AGENT_TOKEN) {
              record("env", { conclusion: "BLOCKED", reason: "missing_secret", detail: "CLOUDFLARE_API_TOKEN or S4B_TEST_AGENT_TOKEN is not set" });
              return;
            }
            if (!/^\S{24,512}$/.test(AGENT_TOKEN)) {
              record("env", { conclusion: "BLOCKED", reason: "token_shape", detail: "S4B_TEST_AGENT_TOKEN does not match ^\\S{24,512}$" });
              return;
            }
            if (!ACCOUNT_ID || !DATABASE_ID || !WORKER_URL || !KEY_ID || !NODE_REF || CHANNELS.length === 0 || !DESIRED_REF || !GENERATION || !RUNNER_TEMP || !WORKSPACE) {
              record("env", { conclusion: "BLOCKED", reason: "missing_config", detail: "a required S4B_* env var is not set" });
              return;
            }
            record("env", { conclusion: "PASS", detail: "secrets present, token shape ok, config complete" });

            // 1. Baseline counts (read-only). A 403 here means the Cloudflare
            // token cannot read D1 at all — stop and say so plainly.
            let baseline;
            let baselineRows;
            try {
              baseline = await d1Counts();
            } catch (e) {
              if (e.http === 401) {
                record("baseline", { conclusion: "BLOCKED", reason: "d1_token_invalid", detail: "CLOUDFLARE_API_TOKEN was rejected by the D1 API (HTTP 401, token invalid or expired). Replace the repo secret with a valid token that has D1 Edit (e.g. the FlyLink DevOps-Connector Token)." });
              } else if (e.http === 403) {
                record("baseline", { conclusion: "BLOCKED", reason: "d1_token_forbidden", detail: "CLOUDFLARE_API_TOKEN was refused by the D1 API (HTTP 403). Replace the repo secret with a token that has D1 Edit (e.g. the FlyLink DevOps-Connector Token)." });
              } else {
                record("baseline", { conclusion: "FAIL", reason: "d1_baseline_error", detail: String(e?.message ?? e) });
              }
              return;
            }
            // Row-by-row baseline: snapshot every row (key + SHA-256 of its
            // canonical JSON) so the readback can prove no baseline row was
            // modified and no foreign row was added. Counts alone cannot.
            try {
              baselineRows = await snapshotRows();
            } catch (e) {
              record("baseline", { conclusion: "FAIL", reason: "d1_baseline_rows_error", detail: String(e?.message ?? e) });
              return;
            }
            record("baseline", { conclusion: "PASS", counts: baseline, rowFingerprints: snapshotFingerprint(baselineRows) });

            // 2. Register the credential (FK order: node -> channels -> credential).
            // Idempotent: re-runs detect existing rows and skip them.
            const tokenDigest = sha256hex(AGENT_TOKEN);
            const now = nowIso();
            try {
              const nodeRows = await d1Rows("SELECT node_ref FROM agent_nodes WHERE node_ref = ?", [NODE_REF]);
              if (nodeRows.length === 0) {
                await d1("INSERT INTO agent_nodes (node_ref, status, created_at, updated_at) VALUES (?, 'active', ?, ?)", [NODE_REF, now, now]);
                record("register_node", { conclusion: "PASS", detail: "inserted" });
              } else {
                record("register_node", { conclusion: "PASS", detail: "already exists, skipped" });
              }
              for (const ch of CHANNELS) {
                const chRows = await d1Rows("SELECT channel_ref FROM agent_node_channels WHERE node_ref = ? AND channel_ref = ?", [NODE_REF, ch]);
                if (chRows.length === 0) {
                  await d1("INSERT INTO agent_node_channels (node_ref, channel_ref, status) VALUES (?, ?, 'active')", [NODE_REF, ch]);
                }
              }
              record("register_channels", { conclusion: "PASS", detail: `${CHANNELS.length} channels present` });
              const credRows = await d1Rows("SELECT key_id, status, length(token_sha256) AS digest_len, revoked_at FROM agent_api_credentials WHERE key_id = ?", [KEY_ID]);
              if (credRows.length === 0) {
                await d1(
                  "INSERT INTO agent_api_credentials (key_id, token_sha256, node_ref, channel_refs_json, status, activated_at, overlap_expires_at, rotation_from_key_id, last_authenticated_at, auth_confirmed_at, revoked_at, created_at) VALUES (?, ?, ?, ?, 'active', ?, NULL, NULL, NULL, NULL, NULL, ?)",
                  [KEY_ID, tokenDigest, NODE_REF, JSON.stringify(CHANNELS), now, now],
                );
                record("register_credential", { conclusion: "PASS", detail: "inserted" });
              } else {
                // The stored digest is compared in memory only; only the
                // match/mismatch flag is recorded, never the digest value.
                const stored = await d1Rows("SELECT token_sha256 FROM agent_api_credentials WHERE key_id = ?", [KEY_ID]);
                const matches = stored[0]?.token_sha256 === tokenDigest;
                if (!matches || credRows[0]?.status !== "active" || credRows[0]?.revoked_at) {
                  record("register_credential", { conclusion: "BLOCKED", reason: "key_id_exists_with_different_token", detail: "key_id already exists but does not match this secret token (or is not active). Rotate the secret or use a new key_id." });
                  return;
                }
                record("register_credential", { conclusion: "PASS", detail: "already exists, digest matches, skipped" });
              }
              const verify = await d1Rows("SELECT key_id, node_ref, status, length(token_sha256) AS digest_len, revoked_at FROM agent_api_credentials WHERE key_id = ?", [KEY_ID]);
              if (verify.length === 1 && verify[0].status === "active" && verify[0].digest_len === 64 && !verify[0].revoked_at) {
                record("verify_credential", { conclusion: "PASS", detail: "1 row, active, digest_len 64, revoked_at null" });
              } else {
                record("verify_credential", { conclusion: "FAIL", reason: "credential_row_unexpected", detail: "row missing or status/digest/revoked_at unexpected" });
                return;
              }
            } catch (e) {
              if (e.http === 403) {
                record("register_credential", { conclusion: "BLOCKED", reason: "d1_token_no_edit", detail: "D1 API refused the write (HTTP 403). CLOUDFLARE_API_TOKEN lacks D1 Edit. Replace the repo secret with a token that has D1 Edit (e.g. the FlyLink DevOps-Connector Token)." });
              } else {
                record("register_credential", { conclusion: "FAIL", reason: "d1_register_error", detail: String(e?.message ?? e) });
              }
              return;
            }

            // 3. Insert a new synthetic desired state (future expiry, active)
            // plus one material row per channel. Skipped if an active desired
            // state already exists for this node (one-active-per-node index).
            try {
              const activeRows = await d1Rows("SELECT desired_state_ref FROM agent_desired_states WHERE node_ref = ? AND status = 'active'", [NODE_REF]);
              if (activeRows.length === 0) {
                const issuedAt = new Date(Date.now() - 1000).toISOString();
                const expiresAt = plusMs(60 * 60 * 1000);
                await d1(
                  "INSERT INTO agent_desired_states (desired_state_ref, node_ref, generation, status, issued_at, expires_at, created_at) VALUES (?, ?, ?, 'active', ?, ?, ?)",
                  [DESIRED_REF, NODE_REF, GENERATION, issuedAt, expiresAt, now],
                );
                for (const ch of CHANNELS) {
                  const edgeRef = `edge-synth-s4bv2-cred-${ch.split("-").pop()}`;
                  const digest = sha256hex(`synthetic-material-s4bv2-cred-${ch.split("-").pop()}`);
                  await d1(
                    "INSERT INTO agent_desired_state_materials (desired_state_ref, channel_ref, edge_credential_ref, digest) VALUES (?, ?, ?, ?)",
                    [DESIRED_REF, ch, edgeRef, digest],
                  );
                }
                record("desired_state", { conclusion: "PASS", detail: "inserted active desired state + materials" });
              } else {
                record("desired_state", { conclusion: "PASS", detail: `active desired state already exists (${activeRows[0].desired_state_ref}), skipped` });
              }
              const dsVerify = await d1Rows("SELECT desired_state_ref, status, expires_at FROM agent_desired_states WHERE node_ref = ? AND status = 'active'", [NODE_REF]);
              if (dsVerify.length === 1 && new Date(dsVerify[0].expires_at).getTime() > Date.now()) {
                record("verify_desired_state", { conclusion: "PASS", detail: "1 active desired state, expires in the future" });
              } else {
                record("verify_desired_state", { conclusion: "FAIL", reason: "desired_state_unexpected", detail: "no active desired state or already expired" });
                return;
              }
            } catch (e) {
              if (e.http === 403) {
                record("desired_state", { conclusion: "BLOCKED", reason: "d1_token_no_edit", detail: "D1 API refused the write (HTTP 403). CLOUDFLARE_API_TOKEN lacks D1 Edit." });
              } else {
                record("desired_state", { conclusion: "FAIL", reason: "d1_desired_state_error", detail: String(e?.message ?? e) });
              }
              return;
            }

            // 4. Formal entry probe (run-once.mjs). Expected: the Worker fence
            // rejects the fetch (no x-writer-epoch is sent) -> retry_later,
            // stage fetch, code writer_epoch_required, exit 3.
            const tokenFile = join(RUNNER_TEMP, "s4b-token.txt");
            const keysFile = join(RUNNER_TEMP, "s4b-manifest-keys.json");
            const stateDir = join(RUNNER_TEMP, "s4b-state");
            const materialsDir = join(RUNNER_TEMP, "s4b-materials");
            try {
              await writeFile(tokenFile, AGENT_TOKEN, { mode: 0o600 });
              await chmod(tokenFile, 0o600);
              const keys = generateKeyPairSync("ed25519");
              const publicPem = keys.publicKey.export({ format: "pem", type: "spki" });
              await writeFile(keysFile, JSON.stringify({ "s4b-wf-test": publicPem }), { mode: 0o600 });
              await chmod(keysFile, 0o600);
              await mkdir(stateDir, { recursive: true, mode: 0o700 });
              await mkdir(materialsDir, { recursive: true, mode: 0o700 });
              const run = await runNode([join(WORKSPACE, "agent/g4/run-once.mjs")], {
                GCCGW_G4_BASE_URL: WORKER_URL,
                GCCGW_G4_NODE_REF: NODE_REF,
                GCCGW_G4_CHANNEL_REFS: CHANNELS.join(","),
                GCCGW_G4_KEY_ID: KEY_ID,
                GCCGW_G4_TOKEN_FILE: tokenFile,
                GCCGW_G4_MANIFEST_KEYS_FILE: keysFile,
                GCCGW_G4_STATE_DIR: stateDir,
                GCCGW_G4_MATERIALS_DIR: materialsDir,
                GCCGW_G4_DRY_RUN: "true",
              });
              let summary = null;
              try { summary = JSON.parse(run.stdout.trim().split("\n").pop()); } catch { summary = null; }
              const expected = run.exit === 3 && summary?.status === "retry_later" && summary?.stage === "fetch" && summary?.code === "writer_epoch_required";
              record("formal_entry", {
                conclusion: expected ? "PASS" : "FAIL",
                expected: "exit 3, retry_later, stage fetch, code writer_epoch_required",
                actual: { exit: run.exit, status: summary?.status ?? null, stage: summary?.stage ?? null, code: summary?.code ?? null },
                ...(expected ? {} : { reason: "formal_entry_unexpected", stderrTail: run.stderr.slice(-300) }),
              });
            } catch (e) {
              record("formal_entry", { conclusion: "FAIL", reason: "formal_entry_error", detail: String(e?.message ?? e) });
            } finally {
              await rm(tokenFile, { force: true });
              await rm(keysFile, { force: true });
              await rm(stateDir, { recursive: true, force: true });
              await rm(materialsDir, { recursive: true, force: true });
            }

            // 5. Direct probes (fetch with full client headers).
            const qs = `nodeRef=${encodeURIComponent(NODE_REF)}&channelRefs=${encodeURIComponent(CHANNELS.join(","))}`;
            const probes = [
              { name: "probe_no_epoch", method: "GET", path: `/v1/agent/desired-state?${qs}`, headers: agentHeaders(), expected: { http: 400, code: "writer_epoch_required" } },
              { name: "probe_epoch_1", method: "GET", path: `/v1/agent/desired-state?${qs}`, headers: agentHeaders("1"), expected: { http: 503, code: "writer_authority_not_d1" } },
              { name: "probe_receipts_empty", method: "POST", path: "/v1/agent/receipts", headers: agentHeaders("1"), body: {}, expected: { http: 400, code: "invalid_receipt" } },
              { name: "probe_route_shape", method: "GET", path: "/v1/agent/desired-state?nodeRef=x", headers: {}, expected: { http: 400, code: "invalid_query" } },
              { name: "probe_healthz", method: "GET", path: "/healthz", headers: {}, expected: { http: 200, code: null } },
              { name: "probe_unknown_route", method: "GET", path: "/v1/no-such-route-xyz", headers: {}, expected: { http: 404, code: "not_found" } },
            ];
            for (const p of probes) {
              try {
                const r = await probe(p.method, p.path, { headers: p.headers, body: p.body });
                const ok = r.http === p.expected.http && r.code === p.expected.code;
                record(p.name, { conclusion: ok ? "PASS" : "FAIL", expected: p.expected, actual: { http: r.http, code: r.code } });
              } catch (e) {
                record(p.name, { conclusion: "FAIL", reason: "probe_error", detail: String(e?.message ?? e) });
              }
            }

            // 6. Node apply + Worker receipt: only possible after a successful
            // fetch returns a manifest. The fence blocks the fetch by design, so
            // there is nothing to apply and no receipt to submit. Record that
            // honestly instead of fabricating a receipt.
            const fetchOk = results.steps.formal_entry?.conclusion === "PASS"
              && results.steps.probe_no_epoch?.conclusion === "PASS";
            record("node_apply", {
              conclusion: "NOT_RUN",
              reason: "no_manifest",
              detail: "fetch was rejected by the epoch fence (expected); no materials were returned, so there is nothing to apply",
            });
            record("worker_receipt", {
              conclusion: "NOT_RUN",
              reason: "no_claim",
              detail: "no manifest claim exists without a successful fetch; a receipt cannot be submitted. The receipts route itself was probed (probe_receipts_empty).",
            });

            // 7. Read-back: row-by-row reconciliation + Worker zero writes.
            // Counts alone cannot catch a baseline row being modified or a
            // foreign row being added, so every row is hashed (SHA-256 over
            // its canonical JSON) and compared by primary key against the
            // baseline snapshot. Only this run's own inserted rows may be
            // new. The fence rejects before nonce consumption and before
            // the auth record write, so the new credential row must still
            // have last_authenticated_at NULL and the nonce count must be
            // unchanged.
            try {
              const after = await d1Counts();
              const afterRows = await snapshotRows();
              const diffs = {};
              for (const t of TABLES) {
                if (after[t] !== baseline[t]) diffs[t] = { before: baseline[t], after: after[t] };
              }
              const { perTable, bad } = reconcileRows(baselineRows, afterRows);
              const credAfter = await d1Rows("SELECT last_authenticated_at, revoked_at FROM agent_api_credentials WHERE key_id = ?", [KEY_ID]);
              const authUntouched = credAfter.length === 1 && !credAfter[0].last_authenticated_at && !credAfter[0].revoked_at;
              const noncesUnchanged = after.agent_request_nonces === baseline.agent_request_nonces;
              const onlyOwnRows = Object.keys(diffs).every((t) =>
                ["agent_nodes", "agent_node_channels", "agent_api_credentials", "agent_desired_states", "agent_desired_state_materials"].includes(t));
              const rowsReconciled = bad === 0;
              record("readback", {
                conclusion: authUntouched && noncesUnchanged && onlyOwnRows && rowsReconciled ? "PASS" : "FAIL",
                countsAfter: after,
                diffs,
                rowReconciliation: perTable,
                rowsReconciled,
                lastAuthenticatedAtNull: authUntouched,
                noncesUnchanged,
                onlyOwnRowsChanged: onlyOwnRows,
                detail: "Row-by-row: baseline rows unchanged (no missing/modified rows), only this run's own inserted rows are new; Worker zero writes: last_authenticated_at still NULL, nonce count unchanged",
              });
            } catch (e) {
              record("readback", { conclusion: "FAIL", reason: "readback_error", detail: String(e?.message ?? e) });
            }

            results.finishedAt = new Date().toISOString();
            results.problems = problems;
            results.conclusion = problems === 0
              ? "evidence collected: auth works, epoch fence works as designed, Worker wrote nothing. S4B is still NO-GO (the full claim-apply-receipt loop needs D1_ACTIVE, which is a separate approval)."
              : "some expected outcomes did not match; see steps.";
          }

          // The wrapper always writes results.json (even when main() returns
          // early on a BLOCKED step) and sets the exit code from the problem
          // count, so the artifact upload always has something to upload.
          main().then(async () => {
            if (!results.finishedAt) {
              results.finishedAt = new Date().toISOString();
              results.problems = problems;
              results.conclusion = problems === 0
                ? "evidence collected: auth works, epoch fence works as designed, Worker wrote nothing. S4B is still NO-GO (the full claim-apply-receipt loop needs D1_ACTIVE, which is a separate approval)."
                : "some expected outcomes did not match; see steps.";
            }
            const outDir = join(RUNNER_TEMP, "s4b-results");
            await mkdir(outDir, { recursive: true });
            await writeFile(join(outDir, "results.json"), JSON.stringify(results, null, 2));
            console.log(JSON.stringify({ problems, conclusion: results.conclusion }));
            if (problems > 0) process.exitCode = 1;
          }).catch((e) => {
            console.error(JSON.stringify({ status: "error", error: String(e?.message ?? e) }));
            process.exitCode = 1;
          });

          S4B_EOF
          node --check "$RUNNER_TEMP/s4b-verify.mjs"

      - name: Run S4B verification
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          S4B_TEST_AGENT_TOKEN: ${{ secrets.S4B_TEST_AGENT_TOKEN }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/s4b-verify.mjs"

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: s4b-staging-verify-results
          path: ${{ runner.temp }}/s4b-results/
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup secret-adjacent files
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/s4b-token.txt" "$RUNNER_TEMP/s4b-manifest-keys.json" "$RUNNER_TEMP/s4b-state" "$RUNNER_TEMP/s4b-materials" || true
