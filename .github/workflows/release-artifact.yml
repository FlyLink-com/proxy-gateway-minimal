name: Release Artifact

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release:
        description: Release label. Defaults to the current short SHA.
        required: false
        type: string
      portal_recharge_trusted_action_origins_json:
        description: Public HTTPS origins JSON for Portal Recharge redirects.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify release changes
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.changes.outputs.lane }}
      run_full: ${{ steps.changes.outputs.run_full }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Determine release lane
        id: changes
        env:
          CI_DIFF_BASE: ${{ github.event.before || '' }}
        run: >-
          node scripts/ci-change-classifier.mjs
          --event-name "$GITHUB_EVENT_NAME"
          --base "$CI_DIFF_BASE"
          --head "$GITHUB_SHA"
          --github-output "$GITHUB_OUTPUT"

  package:
    name: Package source artifact
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.run_full != '0'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Resolve release label
        id: release
        shell: bash
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          set -euo pipefail
          release="$RELEASE_INPUT"
          if [ -z "$release" ]; then
            release="$(git rev-parse --short=12 HEAD)"
          fi
          case "$release" in
            *[!A-Za-z0-9._-]*|'')
              echo "Invalid release label: $release" >&2
              exit 1
              ;;
          esac
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Create source zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-artifacts
          artifact=".release-artifacts/proxy-gateway-${{ steps.release.outputs.release }}.zip"
          git -c core.autocrlf=false archive --format=zip --output "$artifact" HEAD -- . ':(exclude)config/proxy-servers.json' ':(exclude).env'
          node scripts/artifact-git-tree-verifier.mjs \
            --repository . \
            --commit "$GITHUB_SHA" \
            --artifact "$artifact" \
            --exclude-path config/proxy-servers.json \
            --source-only-boundary >/dev/null
          sha256sum "$artifact" | tee "$artifact.sha256"

      - name: Create artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          artifact=".release-artifacts/proxy-gateway-${{ steps.release.outputs.release }}.zip"
          node scripts/create-artifact-manifest.mjs \
            --release-unit control-plane-app \
            --source-commit "$GITHUB_SHA" \
            --release "${{ steps.release.outputs.release }}" \
            --artifact "$artifact" \
            --output .release-artifacts/artifact.json

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: proxy-gateway-${{ steps.release.outputs.release }}
          path: |
            .release-artifacts/proxy-gateway-${{ steps.release.outputs.release }}.zip
            .release-artifacts/proxy-gateway-${{ steps.release.outputs.release }}.zip.sha256
            .release-artifacts/artifact.json
          if-no-files-found: error
          retention-days: 14

  portal-static:
    name: Package Portal static artifact
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.run_full != '0'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install Portal dependencies
        run: npm ci --prefix admin

      - name: Build Portal static
        env:
          VITE_PORTAL_RECHARGE_TRUSTED_ACTION_ORIGINS_JSON: ${{ inputs.portal_recharge_trusted_action_origins_json || '' }}
        run: npm run admin:portal:build

      - name: Verify Portal static
        run: npm run admin:portal:verify

      - name: Resolve Portal release label
        id: release
        shell: bash
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          set -euo pipefail
          release="$RELEASE_INPUT"
          if [ -z "$release" ]; then
            release="$(git rev-parse --short=12 HEAD)"
          fi
          case "$release" in
            *[!A-Za-z0-9._-]*|'')
              echo "Invalid release label: $release" >&2
              exit 1
              ;;
          esac
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Create Portal static zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-artifacts
          artifact=".release-artifacts/globalcircle-portal-${{ steps.release.outputs.release }}.zip"
          (
            cd admin/dist-portal
            zip -q -r "$GITHUB_WORKSPACE/$artifact" .
          )
          sha256sum "$artifact" | tee "$artifact.sha256"

      - name: Create Portal artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          artifact=".release-artifacts/globalcircle-portal-${{ steps.release.outputs.release }}.zip"
          node scripts/create-artifact-manifest.mjs \
            --release-unit portal-static \
            --source-commit "$GITHUB_SHA" \
            --release "${{ steps.release.outputs.release }}" \
            --artifact "$artifact" \
            --output .release-artifacts/artifact.json

      - name: Upload Portal artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: portal-static-${{ steps.release.outputs.release }}
          path: |
            .release-artifacts/globalcircle-portal-${{ steps.release.outputs.release }}.zip
            .release-artifacts/globalcircle-portal-${{ steps.release.outputs.release }}.zip.sha256
            .release-artifacts/artifact.json
          if-no-files-found: error
          retention-days: 14

  admin-static:
    name: Package Admin static artifact
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.run_full != '0'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install Admin dependencies
        run: npm ci --prefix admin

      - name: Build Admin static
        run: npm run admin:build

      - name: Verify Admin static
        run: npm run admin:verify

      - name: Resolve Admin release label
        id: release
        shell: bash
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          set -euo pipefail
          release="$RELEASE_INPUT"
          if [ -z "$release" ]; then
            release="$(git rev-parse --short=12 HEAD)"
          fi
          case "$release" in
            *[!A-Za-z0-9._-]*|'')
              echo "Invalid release label: $release" >&2
              exit 1
              ;;
          esac
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Create Admin static zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-artifacts
          artifact=".release-artifacts/globalcircle-admin-${{ steps.release.outputs.release }}.zip"
          (
            cd admin/dist
            zip -q -r "$GITHUB_WORKSPACE/$artifact" .
          )
          sha256sum "$artifact" | tee "$artifact.sha256"

      - name: Create Admin artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          artifact=".release-artifacts/globalcircle-admin-${{ steps.release.outputs.release }}.zip"
          node scripts/create-artifact-manifest.mjs \
            --release-unit admin-static \
            --source-commit "$GITHUB_SHA" \
            --release "${{ steps.release.outputs.release }}" \
            --artifact "$artifact" \
            --output .release-artifacts/artifact.json

      - name: Upload Admin artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: admin-static-${{ steps.release.outputs.release }}
          path: |
            .release-artifacts/globalcircle-admin-${{ steps.release.outputs.release }}.zip
            .release-artifacts/globalcircle-admin-${{ steps.release.outputs.release }}.zip.sha256
            .release-artifacts/artifact.json
          if-no-files-found: error
          retention-days: 14
