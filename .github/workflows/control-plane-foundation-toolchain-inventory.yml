name: Control Plane Foundation Toolchain Inventory

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: control-plane-foundation-toolchain-inventory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  toolchain-inventory:
    name: Foundation v2 closure inventory only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: docker.io/library/node:22.23.1-bookworm@sha256:175215a1f306ed5df592434b99cc2019f70624373fe49cb659240a618a846aed

    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Validate inventory-only contract
        run: >-
          node --test
          server/tests/control-plane-foundation-toolchain-inventory.test.mjs
          server/tests/control-plane-foundation-toolchain-inventory-workflow.test.mjs

      - name: Emit non-authoritative inventory evidence
        env:
          CONTROL_PLANE_INVENTORY_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          CONTROL_PLANE_FOUNDATION_CONTAINER_IMAGE: docker.io/library/node:22.23.1-bookworm@sha256:175215a1f306ed5df592434b99cc2019f70624373fe49cb659240a618a846aed
        run: node scripts/control-plane-foundation-toolchain-inventory.mjs
