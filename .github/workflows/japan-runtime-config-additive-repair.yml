name: Japan Runtime Config Additive Repair

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: japan-runtime-config-additive-repair
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify immutable inputs without production secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/master'
    outputs:
      ready: ${{ steps.ready.outputs.ready }}

    steps:
      - name: Checkout reviewed workflow commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout frozen artifact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: 47a2a9583fb44cb905e91aade02ae5aa3d635d94
          path: .japan-repair-trusted-source
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Download frozen dry-run artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-dry-run-japan-control-plane-control-plane-cumulative-20260716-003
          path: ${{ runner.temp }}/japan-repair-preflight
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 29495150692

      - name: Verify frozen artifact
        shell: bash
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/japan-repair-preflight
          TRUSTED_SOURCE_DIRECTORY: ${{ github.workspace }}/.japan-repair-trusted-source
        run: |
          set -euo pipefail
          node scripts/japan-tuic-additive-repair-contract.mjs artifact \
            --manifest "$ARTIFACT_DIRECTORY/artifact.json" \
            --artifact "$ARTIFACT_DIRECTORY/proxy-gateway-control-plane-cumulative-20260716-003.zip" \
            --run-id 29495150692 >/dev/null
          node scripts/artifact-git-tree-verifier.mjs \
            --repository "$TRUSTED_SOURCE_DIRECTORY" \
            --commit 47a2a9583fb44cb905e91aade02ae5aa3d635d94 \
            --artifact "$ARTIFACT_DIRECTORY/proxy-gateway-control-plane-cumulative-20260716-003.zip" >/dev/null

      - name: Mark secretless preflight ready
        id: ready
        shell: bash
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

  execute:
    name: Execute restricted Japan runtime-config repair
    needs: preflight
    if: >-
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.ready == 'true' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: vultr-japan-production

    steps:
      - name: Checkout reviewed workflow commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Validate one-time production approval
        shell: bash
        env:
          JAPAN_CI_APPROVAL_BUNDLE: ${{ secrets.JAPAN_CI_APPROVAL_BUNDLE }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          CURRENT_WORKFLOW_REF: ${{ github.workflow_ref }}
          CURRENT_WORKFLOW_COMMIT: ${{ github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          node scripts/japan-tuic-additive-repair-contract.mjs approval >/dev/null

      - name: Download frozen dry-run artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-dry-run-japan-control-plane-control-plane-cumulative-20260716-003
          path: ${{ runner.temp }}/japan-repair-execute
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 29495150692

      - name: Verify frozen artifact
        shell: bash
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/japan-repair-execute
        run: |
          set -euo pipefail
          node scripts/japan-tuic-additive-repair-contract.mjs artifact \
            --manifest "$ARTIFACT_DIRECTORY/artifact.json" \
            --artifact "$ARTIFACT_DIRECTORY/proxy-gateway-control-plane-cumulative-20260716-003.zip" \
            --run-id 29495150692 >/dev/null

      - name: Prepare restricted SSH material
        shell: bash
        env:
          JAPAN_CI_HOST: ${{ secrets.JAPAN_CI_HOST }}
          JAPAN_CI_PORT: ${{ secrets.JAPAN_CI_PORT }}
          JAPAN_CI_USER: ${{ secrets.JAPAN_CI_USER }}
          JAPAN_CI_PRIVATE_KEY: ${{ secrets.JAPAN_CI_PRIVATE_KEY }}
          JAPAN_CI_KNOWN_HOSTS: ${{ secrets.JAPAN_CI_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          KEY_FILE="$RUNNER_TEMP/japan-repair-key"
          KNOWN_HOSTS_FILE="$RUNNER_TEMP/japan-repair-known-hosts"
          if [[ ! "$JAPAN_CI_HOST" =~ ^[^[:space:]]{1,255}$ ]] || \
             [[ ! "$JAPAN_CI_USER" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || \
             [[ ! "$JAPAN_CI_PORT" =~ ^[0-9]{1,5}$ ]] || \
             (( JAPAN_CI_PORT < 1 || JAPAN_CI_PORT > 65535 )) || \
             [[ -z "$JAPAN_CI_PRIVATE_KEY" ]] || \
             [[ -z "$JAPAN_CI_KNOWN_HOSTS" ]]; then
            echo "restricted_identity_rejected" >&2
            exit 1
          fi
          printf '%s\n' "$JAPAN_CI_PRIVATE_KEY" | tr -d '\r' > "$KEY_FILE"
          printf '%s\n' "$JAPAN_CI_KNOWN_HOSTS" | tr -d '\r' > "$KNOWN_HOSTS_FILE"
          chmod 600 "$KEY_FILE" "$KNOWN_HOSTS_FILE"
          test -s "$KEY_FILE"
          test -s "$KNOWN_HOSTS_FILE"

      - name: Execute forced-command repair
        id: restricted_repair
        shell: bash
        env:
          JAPAN_CI_HOST: ${{ secrets.JAPAN_CI_HOST }}
          JAPAN_CI_PORT: ${{ secrets.JAPAN_CI_PORT }}
          JAPAN_CI_USER: ${{ secrets.JAPAN_CI_USER }}
          ARTIFACT_FILE: ${{ runner.temp }}/japan-repair-execute/proxy-gateway-control-plane-cumulative-20260716-003.zip
          KEY_FILE: ${{ runner.temp }}/japan-repair-key
          KNOWN_HOSTS_FILE: ${{ runner.temp }}/japan-repair-known-hosts
          RECEIPT_FILE: ${{ runner.temp }}/japan-repair-receipt.json
          SSH_ERROR_FILE: ${{ runner.temp }}/japan-repair-ssh-error.txt
        run: |
          set -euo pipefail
          umask 077
          set +e
          ssh -F /dev/null -T \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o LogLevel=ERROR \
            -o ClearAllForwardings=yes \
            -o RequestTTY=no \
            -o ConnectionAttempts=1 \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            -o GlobalKnownHostsFile=/dev/null \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -i "$KEY_FILE" \
            -p "$JAPAN_CI_PORT" \
            -- "$JAPAN_CI_USER@$JAPAN_CI_HOST" \
            < "$ARTIFACT_FILE" > "$RECEIPT_FILE" 2> "$SSH_ERROR_FILE"
          ssh_status=$?
          set -e
          echo "ssh_status=$ssh_status" >> "$GITHUB_OUTPUT"

      - name: Validate aggregate receipt
        if: always()
        shell: bash
        env:
          SSH_STATUS: ${{ steps.restricted_repair.outputs.ssh_status }}
          RECEIPT_FILE: ${{ runner.temp }}/japan-repair-receipt.json
          VALIDATED_RECEIPT_FILE: ${{ runner.temp }}/japan-repair-validated-receipt.json
        run: |
          set -euo pipefail
          umask 077
          node scripts/japan-tuic-additive-repair-contract.mjs receipt \
            --input "$RECEIPT_FILE" > "$VALIDATED_RECEIPT_FILE"
          VALIDATED_RECEIPT_FILE="$VALIDATED_RECEIPT_FILE" node --input-type=module - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from "node:fs";
          const receipt = JSON.parse(readFileSync(process.env.VALIDATED_RECEIPT_FILE, "utf8"));
          process.stdout.write(`### Japan runtime-config repair\n\n\`\`\`json\n${JSON.stringify(receipt)}\n\`\`\`\n`);
          NODE
          VALIDATED_RECEIPT_FILE="$VALIDATED_RECEIPT_FILE" SSH_STATUS="$SSH_STATUS" node --input-type=module - <<'NODE'
          import { readFileSync } from "node:fs";
          const receipt = JSON.parse(readFileSync(process.env.VALIDATED_RECEIPT_FILE, "utf8"));
          const accepted = process.env.SSH_STATUS === "0"
            && receipt.productionResult === "applied_validated"
            && receipt.hostCredentialCleanup === "verified"
            && receipt.closeout === "github_cleanup_pending";
          process.exitCode = accepted ? 0 : 1;
          NODE

      - name: Remove runner-side temporary material
        if: always()
        shell: bash
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/japan-repair-execute
          KEY_FILE: ${{ runner.temp }}/japan-repair-key
          KNOWN_HOSTS_FILE: ${{ runner.temp }}/japan-repair-known-hosts
          RECEIPT_FILE: ${{ runner.temp }}/japan-repair-receipt.json
          VALIDATED_RECEIPT_FILE: ${{ runner.temp }}/japan-repair-validated-receipt.json
          SSH_ERROR_FILE: ${{ runner.temp }}/japan-repair-ssh-error.txt
        run: |
          set -euo pipefail
          rm -f -- "$KEY_FILE" "$KNOWN_HOSTS_FILE" "$RECEIPT_FILE" \
            "$VALIDATED_RECEIPT_FILE" "$SSH_ERROR_FILE"
          rm -rf -- "$ARTIFACT_DIRECTORY"
          test ! -e "$KEY_FILE"
          test ! -e "$KNOWN_HOSTS_FILE"
          test ! -e "$RECEIPT_FILE"
          test ! -e "$VALIDATED_RECEIPT_FILE"
          test ! -e "$SSH_ERROR_FILE"
          test ! -e "$ARTIFACT_DIRECTORY"
