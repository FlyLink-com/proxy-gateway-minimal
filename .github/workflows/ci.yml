name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install admin dependencies
        run: npm ci --prefix admin

      - name: Run server tests
        run: npm test

      - name: Run admin tests
        run: npm run admin:test

      - name: Build admin app
        run: npm run admin:build

      - name: Build public site
        run: npm run cloudflare:site:build

      - name: Verify public site boundary
        run: npm run cloudflare:site:verify

      - name: Cloudflare public site dry run
        run: npm run cloudflare:site:dry-run
