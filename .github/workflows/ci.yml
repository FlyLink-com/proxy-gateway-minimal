name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-evidence:
    name: Governance evidence
    if: github.event_name != 'workflow_dispatch' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Validate Gate ledger and repair routing
        shell: bash
        env:
          CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          [[ "$CI_DIFF_BASE" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$CI_DIFF_BASE^{commit}"
          base_gates=0
          base_policy=0
          if git cat-file -e "$CI_DIFF_BASE:project-state/gates.json" 2>/dev/null; then
            base_gates=1
          fi
          if git cat-file -e "$CI_DIFF_BASE:project-state/repair-policy.json" 2>/dev/null; then
            base_policy=1
          fi
          if [[ "$base_gates" == "1" && "$base_policy" == "1" ]]; then
            git show "$CI_DIFF_BASE:project-state/gates.json" > "$RUNNER_TEMP/base-gates.json"
            git show "$CI_DIFF_BASE:project-state/repair-policy.json" > "$RUNNER_TEMP/base-policy.json"
            node scripts/check-gate-governance.mjs \
              --base-gates-file "$RUNNER_TEMP/base-gates.json" \
              --base-policy-file "$RUNNER_TEMP/base-policy.json"
          elif [[ "$base_gates" == "0" && "$base_policy" == "0" ]]; then
            node scripts/check-gate-governance.mjs --base-state-missing
          else
            echo "partial governance base state is forbidden" >&2
            exit 1
          fi

  governance-snapshot:
    name: Governance snapshot
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Validate current governance snapshot
        run: node scripts/check-gate-governance.mjs --snapshot

  source-checks:
    name: Source checks
    outputs:
      run_full: ${{ steps.changes.outputs.run_full }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json

      - name: Run privileged Welcome Coins custody synthetic gate
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PULL_REQUEST_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              test -n "$PULL_REQUEST_REPOSITORY"
              test "$PULL_REQUEST_REPOSITORY" = "$EXPECTED_REPOSITORY"
              expected_source_commit="$PULL_REQUEST_SOURCE_COMMIT"
              ;;
            push|workflow_dispatch)
              expected_source_commit="$WORKFLOW_SOURCE_COMMIT"
              ;;
            *)
              exit 1
              ;;
          esac
          [[ "$expected_source_commit" =~ ^[0-9a-f]{40}$ ]]
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "$expected_source_commit"

          node_binary="$(realpath "$(type -P node)")"
          test -x "$node_binary"
          node_major="$("$node_binary" --input-type=module --eval 'process.stdout.write(process.versions.node.split(".")[0])')"
          test "$node_major" = "22"

          /usr/bin/sudo -n /usr/bin/env -i \
              PATH=/usr/bin:/bin \
              LANG=C \
              LC_ALL=C \
              WELCOME_COINS_PRIVILEGED_SYNTHETIC_GATE=1 \
              /usr/bin/timeout --signal=TERM --kill-after=2s 10s \
              "$node_binary" scripts/validation-environment-preflight.mjs \
              --profile privileged-synthetic

          /usr/bin/sudo -n /usr/bin/env -i \
              PATH=/usr/bin:/bin \
              LANG=C \
              LC_ALL=C \
              WELCOME_COINS_PRIVILEGED_SYNTHETIC_GATE=1 \
              /usr/bin/timeout --signal=TERM --kill-after=10s 180s \
              "$node_binary" --test --test-concurrency=1 \
              server/tests/control-plane-welcome-coins-native-synthetic-runner.test.mjs

      - name: Determine validation lane
        id: changes
        env:
          CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CI_DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node scripts/ci-change-classifier.mjs
          --event-name "$GITHUB_EVENT_NAME"
          --base "$CI_DIFF_BASE"
          --head "$CI_DIFF_HEAD"
          --github-output "$GITHUB_OUTPUT"

      - name: Preflight source validation environment
        if: steps.changes.outputs.run_full != '0'
        run: npm run validation:environment:source

      - name: Check diff
        if: always()
        shell: bash
        env:
          CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CI_DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            range="HEAD^...HEAD"
          else
            [[ "$CI_DIFF_BASE" =~ ^[0-9a-f]{40}$ ]]
            [[ "$CI_DIFF_HEAD" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "$CI_DIFF_BASE^{commit}"
            git cat-file -e "$CI_DIFF_HEAD^{commit}"
            range="$CI_DIFF_BASE...$CI_DIFF_HEAD"
          fi
          git diff --check "$range"

      - name: Check document authority (strict)
        if: always()
        run: npm run docs:authority:strict

      - name: Install root dependencies
        if: steps.changes.outputs.run_full != '0'
        run: npm ci

      - name: Install admin dependencies
        if: steps.changes.outputs.run_full != '0'
        run: npm ci --prefix admin

      - name: Run server tests
        if: steps.changes.outputs.run_full != '0'
        run: npm test

      - name: Run admin tests
        if: steps.changes.outputs.run_full != '0'
        run: npm run admin:test

      - name: Check certificate hooks before final builds
        if: steps.changes.outputs.run_full != '0'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ops/certificates -p test_runtime_certificate_sync.py -v
          python3 -m py_compile ops/certificates/runtime_certificate_sync.py
          sh -n ops/certificates/certbot-deploy-hook.sh.in

  foundation-inventory:
    name: Foundation inventory
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    uses: ./.github/workflows/control-plane-foundation-toolchain-inventory.yml

  checks-passed:
    name: Prerequisite checks
    needs: [governance-evidence, governance-snapshot, source-checks, foundation-inventory]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    steps:
      - name: Require every applicable prerequisite to succeed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_RESULT: ${{ needs.source-checks.result }}
          GOVERNANCE_RESULT: ${{ needs.governance-evidence.result }}
          SNAPSHOT_RESULT: ${{ needs.governance-snapshot.result }}
          FOUNDATION_RESULT: ${{ needs.foundation-inventory.result }}
        run: |
          set -euo pipefail
          test "$SOURCE_RESULT" = success
          case "$EVENT_NAME" in
            pull_request)
              test "$GOVERNANCE_RESULT" = success
              test "$SNAPSHOT_RESULT" = skipped
              test "$FOUNDATION_RESULT" = success
              ;;
            push)
              test "$GOVERNANCE_RESULT" = success
              test "$SNAPSHOT_RESULT" = skipped
              test "$FOUNDATION_RESULT" = skipped
              ;;
            workflow_dispatch)
              test "$GOVERNANCE_RESULT" = skipped
              test "$SNAPSHOT_RESULT" = success
              test "$FOUNDATION_RESULT" = skipped
              ;;
            *) exit 1 ;;
          esac

  build-assets:
    name: Build and verify assets
    needs: [checks-passed, source-checks]
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && !cancelled() && needs.checks-passed.result == 'success' && needs.source-checks.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json

      - name: Preflight build validation environment
        if: needs.source-checks.outputs.run_full != '0'
        run: npm run validation:environment:source

      - name: Install root dependencies
        if: needs.source-checks.outputs.run_full != '0'
        run: npm ci

      - name: Install admin dependencies
        if: needs.source-checks.outputs.run_full != '0'
        run: npm ci --prefix admin

      - name: Build admin app
        if: needs.source-checks.outputs.run_full != '0'
        run: npm run admin:build

      - name: Verify admin build boundary
        if: needs.source-checks.outputs.run_full != '0'
        run: npm run admin:verify

      - name: Build Portal app
        if: needs.source-checks.outputs.run_full != '0'
        run: npm run admin:portal:build

      - name: Verify Portal build boundary
        if: needs.source-checks.outputs.run_full != '0'
        run: npm run admin:portal:verify

      - name: Build Portal desktop app
        if: needs.source-checks.outputs.run_full != '0'
        run: npm run admin:portal:web:build

      - name: Verify Portal desktop build boundary
        if: needs.source-checks.outputs.run_full != '0'
        run: npm run admin:portal:web:verify

      - name: Build public site
        if: needs.source-checks.outputs.run_full != '0'
        run: npm run cloudflare:site:build

      - name: Verify public site boundary
        if: needs.source-checks.outputs.run_full != '0'
        run: npm run cloudflare:site:verify

      - name: Cloudflare public site dry run
        if: needs.source-checks.outputs.run_full != '0'
        run: npm run cloudflare:site:dry-run

  dependency-artifact:
    name: Dependency artifact
    needs: checks-passed
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && !cancelled() && needs.checks-passed.result == 'success'
    uses: ./.github/workflows/control-plane-dependency-artifact.yml

  validate:
    name: Validate
    needs: [checks-passed, build-assets, dependency-artifact]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    steps:
      - name: Require checks and final builds to succeed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHECKS_RESULT: ${{ needs.checks-passed.result }}
          ASSETS_RESULT: ${{ needs.build-assets.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-artifact.result }}
        run: |
          set -euo pipefail
          test "$CHECKS_RESULT" = success
          test "$ASSETS_RESULT" = success
          case "$EVENT_NAME" in
            pull_request) test "$DEPENDENCY_RESULT" = success ;;
            push|workflow_dispatch) test "$DEPENDENCY_RESULT" = skipped ;;
            *) exit 1 ;;
          esac
