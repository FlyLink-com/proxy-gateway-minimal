name: Control Plane Dependency Artifact

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release:
        description: Dependency artifact release label
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: control-plane-dependency-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Linux dependency artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup exact Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked production dependencies
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Build reviewed Welcome Coins native custody bundle
        shell: bash
        run: |
          set -euo pipefail
          node scripts/control-plane-welcome-coins-native-build-cli.mjs --mode build --root .
          mkdir -p .dependency-artifacts/native-a
          cp --preserve=mode node_modules/.gccgw-native/welcome-coins-activation-outer-wrapper .dependency-artifacts/native-a/
          cp --preserve=mode node_modules/.gccgw-native/welcome-coins-outer-post-exec-bootstrap.so .dependency-artifacts/native-a/
          cp --preserve=mode node_modules/.gccgw-native/welcome-coins-custody-launcher .dependency-artifacts/native-a/
          cp --preserve=mode node_modules/.gccgw-native/welcome-coins-post-exec-bootstrap.so .dependency-artifacts/native-a/
          cp --preserve=mode node_modules/.gccgw-native/welcome-coins-native-build.json .dependency-artifacts/native-a/

      - name: Run native dependency smoke
        run: >-
          node scripts/control-plane-dependency-artifact-cli.mjs
          --mode smoke
          --root .
          --snapshot scripts/control-plane-db-snapshot-gate-lib.mjs

      - name: Read runtime identity for artifact binding
        run: >-
          node --input-type=module --eval
          'import { detectDependencyRuntime } from "./scripts/control-plane-dependency-artifact-lib.mjs";
          console.log(JSON.stringify(detectDependencyRuntime({ root: "." })))'

      - name: Build twice and create deterministic dependency archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .dependency-artifacts
          tar \
            --create \
            --file .dependency-artifacts/node-modules-a.tar \
            --format=posix \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --hard-dereference \
            --pax-option=delete=atime,delete=ctime,delete=SCHILY.dev,delete=SCHILY.ino,delete=SCHILY.nlink \
            -- node_modules
          npm ci --omit=dev --no-audit --no-fund
          node scripts/control-plane-welcome-coins-native-build-cli.mjs --mode build --root .
          node scripts/control-plane-welcome-coins-native-build-cli.mjs --mode verify --root .
          cmp --silent .dependency-artifacts/native-a/welcome-coins-activation-outer-wrapper node_modules/.gccgw-native/welcome-coins-activation-outer-wrapper
          cmp --silent .dependency-artifacts/native-a/welcome-coins-outer-post-exec-bootstrap.so node_modules/.gccgw-native/welcome-coins-outer-post-exec-bootstrap.so
          cmp --silent .dependency-artifacts/native-a/welcome-coins-custody-launcher node_modules/.gccgw-native/welcome-coins-custody-launcher
          cmp --silent .dependency-artifacts/native-a/welcome-coins-post-exec-bootstrap.so node_modules/.gccgw-native/welcome-coins-post-exec-bootstrap.so
          cmp --silent .dependency-artifacts/native-a/welcome-coins-native-build.json node_modules/.gccgw-native/welcome-coins-native-build.json
          node scripts/control-plane-dependency-artifact-cli.mjs \
            --mode smoke \
            --root . \
            --snapshot scripts/control-plane-db-snapshot-gate-lib.mjs
          tar \
            --create \
            --file .dependency-artifacts/node-modules-b.tar \
            --format=posix \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --hard-dereference \
            --pax-option=delete=atime,delete=ctime,delete=SCHILY.dev,delete=SCHILY.ino,delete=SCHILY.nlink \
            -- node_modules
          test "$(sha256sum .dependency-artifacts/node-modules-a.tar | cut -d' ' -f1)" = "$(sha256sum .dependency-artifacts/node-modules-b.tar | cut -d' ' -f1)"
          cmp --silent .dependency-artifacts/node-modules-a.tar .dependency-artifacts/node-modules-b.tar
          mv .dependency-artifacts/node-modules-b.tar .dependency-artifacts/node-modules.tar
          rm .dependency-artifacts/node-modules-a.tar
          rm -rf .dependency-artifacts/native-a

      - name: Write dependency artifact manifest
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          RELEASE_INPUT: ${{ inputs.release || '' }}
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "$EXPECTED_SOURCE_COMMIT"
          release="$RELEASE_INPUT"
          if [ -z "$release" ]; then
            release="$(git rev-parse --short=12 HEAD)"
          fi
          case "$release" in
            *[!A-Za-z0-9._-]*|'')
              echo 'invalid_release_label' >&2
              exit 1
              ;;
          esac
          node scripts/control-plane-dependency-artifact-cli.mjs \
            --mode build \
            --root . \
            --archive .dependency-artifacts/node-modules.tar \
            --source-commit "$source_commit" \
            --release "$release" \
            --snapshot scripts/control-plane-db-snapshot-gate-lib.mjs \
            --output .dependency-artifacts/dependency-artifact.json
          printf '%s\n' "$release" > .dependency-artifacts/release-label.txt

      - name: Read manifest tree evidence before consumer replay
        run: >-
          node --input-type=module --eval
          'import { readFileSync } from "node:fs";
          const value = JSON.parse(readFileSync(".dependency-artifacts/dependency-artifact.json", "utf8"));
          console.log(JSON.stringify({ tree: value.tree, runtime: value.runtime, archive: value.archive }));'

      - name: Re-verify dependency artifact and native tree
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "$EXPECTED_SOURCE_COMMIT"
          release="$(cat .dependency-artifacts/release-label.txt)"
          node scripts/control-plane-dependency-artifact-cli.mjs \
            --mode verify \
            --root . \
            --archive .dependency-artifacts/node-modules.tar \
            --manifest .dependency-artifacts/dependency-artifact.json \
            --source-commit "$source_commit" \
            --release "$release" \
            --snapshot scripts/control-plane-db-snapshot-gate-lib.mjs

      - name: Assemble exact clean-room artifact input
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "$EXPECTED_SOURCE_COMMIT"
          release="$(cat .dependency-artifacts/release-label.txt)"
          case "$release" in
            *[!A-Za-z0-9._-]*|'')
              echo 'invalid_release_label' >&2
              exit 1
              ;;
          esac
          test ! -e .clean-room-input
          install -d -m 0700 .clean-room-input
          artifact_name="proxy-gateway-${release}.zip"
          artifact=".clean-room-input/${artifact_name}"
          git -c core.autocrlf=false archive \
            --format=zip \
            --output "$artifact" \
            HEAD \
            -- . ':(exclude)config/proxy-servers.json' ':(exclude).env'
          node scripts/artifact-git-tree-verifier.mjs \
            --repository . \
            --commit "$source_commit" \
            --artifact "$artifact" \
            --exclude-path config/proxy-servers.json \
            --source-only-boundary >/dev/null
          artifact_sha256="$(sha256sum "$artifact" | cut -d' ' -f1)"
          printf '%s  .release-artifacts/%s\n' \
            "$artifact_sha256" "$artifact_name" \
            > "${artifact}.sha256"
          node scripts/create-artifact-manifest.mjs \
            --release-unit control-plane-app \
            --source-commit "$source_commit" \
            --release "$release" \
            --artifact "$artifact" \
            --output .clean-room-input/artifact.json
          install -m 0600 \
            .dependency-artifacts/dependency-artifact.json \
            .clean-room-input/dependency-artifact.json
          install -m 0600 \
            .dependency-artifacts/node-modules.tar \
            .clean-room-input/node-modules.tar
          install -m 0600 \
            .dependency-artifacts/release-label.txt \
            .clean-room-input/release-label.txt
          chmod 0600 \
            .clean-room-input/artifact.json \
            "$artifact" \
            "${artifact}.sha256"
          test "$(find .clean-room-input -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 6

      - name: Run exact control-plane clean-room artifact smoke
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "$EXPECTED_SOURCE_COMMIT"
          release="$(cat .dependency-artifacts/release-label.txt)"
          node scripts/control-plane-clean-room-artifact-smoke.mjs \
            --repository . \
            --input-directory .clean-room-input \
            --expected-source-commit "$source_commit" \
            --expected-artifact-release "$release"

      - name: Upload dependency artifact on non-PR refs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: control-plane-dependency-${{ github.sha }}
          path: |
            .dependency-artifacts/node-modules.tar
            .dependency-artifacts/dependency-artifact.json
            .dependency-artifacts/release-label.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
