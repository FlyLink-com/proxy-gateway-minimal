name: Production Deploy Dry Run

on:
  workflow_dispatch:
    inputs:
      target:
        description: Production target to prepare.
        required: true
        type: choice
        options:
          - japan-control-plane
          - sgp-edge-agent
          - full-rollout
      release:
        description: Release label to package. Defaults to the current short SHA.
        required: false
        type: string
      expected_current_release:
        description: Expected current production release. Required for real promotion gates.
        required: true
        type: string
      confirmation:
        description: Type "dry-run production deploy".
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy-dry-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: Build deploy packet without host mutation
    runs-on: ubuntu-latest
    if: inputs.confirmation == 'dry-run production deploy'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install admin dependencies
        run: npm ci --prefix admin

      - name: Run validation
        run: |
          npm test
          npm run admin:test
          npm run admin:build
          npm run cloudflare:site:build
          npm run cloudflare:site:verify
          npm run project-state:check

      - name: Resolve release label
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release="${{ inputs.release }}"
          if [ -z "$release" ]; then
            release="$(git rev-parse --short=12 HEAD)"
          fi
          case "$release" in
            *[!A-Za-z0-9._-]*|'')
              echo "Invalid release label: $release" >&2
              exit 1
              ;;
          esac
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Create deploy packet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-artifacts
          artifact=".release-artifacts/proxy-gateway-${{ steps.release.outputs.release }}.zip"
          git -c core.autocrlf=false archive --format=zip --output "$artifact" HEAD -- . ':(exclude)config/proxy-servers.json' ':(exclude).env'
          node scripts/artifact-git-tree-verifier.mjs \
            --repository . \
            --commit "$GITHUB_SHA" \
            --artifact "$artifact" \
            --exclude-path config/proxy-servers.json \
            --source-only-boundary >/dev/null
          sha256sum "$artifact" | tee "$artifact.sha256"
          {
            echo "This workflow is a production deploy dry run only."
            echo "It creates and validates a release artifact."
            echo "It does not SSH to production, switch symlinks, restart services,"
            echo "mutate DNS/Nginx/firewall/systemd/runtime config, or read protected"
            echo "runtime material."
          } > .release-artifacts/deploy-plan.txt
          {
            echo "target=${{ inputs.target }}"
            echo "release=${{ steps.release.outputs.release }}"
            echo "expected_current_release=${{ inputs.expected_current_release }}"
          } >> .release-artifacts/deploy-plan.txt

      - name: Create artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          artifact=".release-artifacts/proxy-gateway-${{ steps.release.outputs.release }}.zip"
          node scripts/create-artifact-manifest.mjs \
            --release-unit control-plane-app \
            --source-commit "$GITHUB_SHA" \
            --release "${{ steps.release.outputs.release }}" \
            --artifact "$artifact" \
            --output .release-artifacts/artifact.json

      - name: Upload dry-run packet
        uses: actions/upload-artifact@v7
        with:
          name: production-dry-run-${{ inputs.target }}-${{ steps.release.outputs.release }}
          path: |
            .release-artifacts/proxy-gateway-${{ steps.release.outputs.release }}.zip
            .release-artifacts/proxy-gateway-${{ steps.release.outputs.release }}.zip.sha256
            .release-artifacts/deploy-plan.txt
            .release-artifacts/artifact.json
          if-no-files-found: error
          retention-days: 14
