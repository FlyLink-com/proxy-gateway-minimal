      <text x="470" y="127" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1">CONTROL</text>
      <rect x="64" y="246" width="122" height="34" rx="17" fill="#FFFFFF" stroke="#BFDBFE"/>
      <text x="125" y="269" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1">DELIVERY</text>
      <rect x="540" y="326" width="112" height="34" rx="17" fill="#FFFFFF" stroke="#BFDBFE"/>
      <text x="596" y="349" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1">NODES</text>
