<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">FlyLink Gateway — Subscription Control &amp; Delivery Platform</title>
  <desc id="desc">A clean blue and white network illustration with connected control, delivery, and node points.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#1D4ED8" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1600" height="480" rx="30" fill="url(#bg)"/>
  <circle cx="1460" cy="35" r="250" fill="#DBEAFE" opacity=".42"/>
  <circle cx="1300" cy="450" r="300" fill="#BFDBFE" opacity=".22"/>
  <path d="M0 390 C260 310 410 510 700 410 S1160 280 1600 360" fill="none" stroke="#DBEAFE" stroke-width="2"/>
  <path d="M0 420 C300 340 470 520 770 430 S1240 310 1600 390" fill="none" stroke="#E0F2FE" stroke-width="2"/>
  <g transform="translate(105 104)">
    <rect x="0" y="0" width="6" height="230" rx="3" fill="url(#blue)"/>
    <text x="34" y="48" fill="#1E3A8A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="5">PUBLIC SOURCE REPOSITORY</text>
    <text x="30" y="132" fill="#0F172A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="72" font-weight="750" letter-spacing="-2">FlyLink Gateway</text>
    <text x="34" y="184" fill="#2563EB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="650" letter-spacing="1.3">SUBSCRIPTION CONTROL &amp; DELIVERY PLATFORM</text>
    <text x="34" y="226" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">订阅控制与节点交付平台</text>
  </g>
  <g transform="translate(950 62)" filter="url(#shadow)">
    <path d="M125 185 L300 88 L470 185 L595 112 M125 185 L280 310 L470 185 L595 280 M300 88 L280 310 M470 185 L595 112 M470 185 L595 280" fill="none" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>
    <path d="M125 185 L300 88 L470 185" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" opacity=".65"/>
    <g fill="#FFFFFF" stroke="#60A5FA" stroke-width="3">
      <circle cx="125" cy="185" r="34"/>
      <circle cx="300" cy="88" r="28"/>
      <circle cx="280" cy="310" r="28"/>
      <circle cx="470" cy="185" r="42"/>
      <circle cx="595" cy="112" r="25"/>
      <circle cx="595" cy="280" r="25"/>
    </g>
    <g fill="url(#blue)">
      <circle cx="125" cy="185" r="12"/>
      <circle cx="300" cy="88" r="10"/>
      <circle cx="280" cy="310" r="10"/>
      <circle cx="470" cy="185" r="16"/>
      <circle cx="595" cy="112" r="9"/>
      <circle cx="595" cy="280" r="9"/>
    </g>
